# Example nginx site for llama-swap
#
# Replace YOUR_DOMAIN and certificate paths, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# llama-swap must listen on loopback only:
#   llama-swap --config config.yaml --listen localhost:8080

upstream llama_swap {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate-limit zones (shared across workers)
limit_req_zone $binary_remote_addr zone=ls_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ls_infer:10m rate=30r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # --- TLS (Certbot will usually manage these) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (optional but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    client_max_body_size 32m;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Public health probes
    location = /health {
        proxy_pass http://llama_swap;
    }
    location = /wol-health {
        proxy_pass http://llama_swap;
    }

    # Admin login — strict rate limit
    location = /api/auth/login {
        limit_req zone=ls_login burst=10 nodelay;
        proxy_pass http://llama_swap;
    }

    # SSE / event streams — must not buffer
    location /api/events {
        proxy_pass http://llama_swap;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
    location /logs/stream {
        proxy_pass http://llama_swap;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Streaming inference — must not buffer
    location /v1/ {
        limit_req zone=ls_infer burst=60 nodelay;
        proxy_pass http://llama_swap;
        proxy_buffering off;
        proxy_cache off;
    }

    # Other generative endpoints used by some clients
    location /completion {
        limit_req zone=ls_infer burst=60 nodelay;
        proxy_pass http://llama_swap;
        proxy_buffering off;
        proxy_cache off;
    }
    location /v1/chat/completions {
        limit_req zone=ls_infer burst=60 nodelay;
        proxy_pass http://llama_swap;
        proxy_buffering off;
        proxy_cache off;
    }

    # Everything else (UI, admin APIs, metrics, upstream helper)
    location / {
        proxy_pass http://llama_swap;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}
